# Tests, build, and -- for a version tag -- a draft release whose files
# were built here, from this repository, with a signed record saying so.
#
# Why this exists: Prune ships unsigned, and SHA256SUMS.txt only proves a
# download arrived intact, not who built it. A GitHub artifact attestation
# closes most of that gap for free: anyone can run
#   gh attestation verify "Prune.Setup.X.Y.Z.exe" --repo jimman0I/prune
# and see that the file was produced by this workflow, from a named commit
# of this public repository. It is also what SignPath Foundation needs
# before it will sign anything: a verifiable, automated build.
#
# Windows runners throughout. The backend shells out to reg.exe and
# PowerShell, its tests include real-PowerShell and real-Recycle-Bin
# checks, and the installer is built with NSIS -- none of which exist on
# Linux.
name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to the same branch makes an older run pointless; a tag
  # build is never cancelled halfway.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  backend-tests:
    name: Backend tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      # Windows Defender's real-time scan on a GitHub-hosted runner adds
      # real, sometimes multi-second, latency to every new file this suite
      # writes -- and this suite writes a lot of them, since several action
      # types shell out to a real bundled sqlite3.exe against real SQLite
      # fixtures on disk rather than mocking the mechanism under test. First
      # observed on the v2.6.0 build: EBUSY on deleting a just-used temp
      # .sql script, and tests that pass in well under a second locally
      # timing out even at 15s here. Excluding TEMP is the standard fix for
      # this exact GitHub Actions Windows-runner behavior, not a workaround
      # for a real bug -- the scan itself is the extra cost, not the code.
      - name: Exclude TEMP from Windows Defender's real-time scan
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:TEMP
          # Evidence, not a gate: shows whether the exclusion took, next to
          # the directory the tests' mkdtemp() will actually use. If these
          # ever disagree (an 8.3 RUNNER~1 spelling vs the long name) the
          # exclusion is not covering the tests' files.
          Write-Host "Defender exclusions: $((Get-MpPreference).ExclusionPath -join '; ')"
          Write-Host "Node tmpdir:         $(node -p "require('os').tmpdir()")"
      # On its own runner, which is also the rule locally (CONTRIBUTING.md):
      # the reg.exe and PowerShell tests time out when something else is
      # competing for the machine.
      - run: npm test
        working-directory: backend

  frontend-tests:
    name: Frontend tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  build:
    name: Build installer
    needs: [backend-tests, frontend-tests]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write          # Sigstore certificate for the attestation
      attestations: write      # store the attestation
      artifact-metadata: write # the artifact storage record
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # No dependency cache in the job that signs attestations, as
          # setup-node advises for jobs with elevated permissions: what is
          # attested should come from a clean install, not a restored one.
          package-manager-cache: false
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: electron
        env:
          # electron-builder downloads the Electron it packages itself; the
          # copy electron's own postinstall fetches would never be used.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # The updater's consent rules and the installer's languages, before
      # anything is built. Node's own test runner, so no new dependency.
      - run: npm test
        working-directory: electron
      # The same script a local release runs: frontend build, a clean
      # production-only backend install, electron-builder, SHA256SUMS.txt.
      - run: npm run dist
        working-directory: electron

      - name: Check the checksums against the files
        shell: pwsh
        working-directory: electron/dist
        run: |
          foreach ($line in Get-Content SHA256SUMS.txt) {
            $hash, $name = $line -split '  ', 2
            $actual = (Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $hash) { throw "SHA256SUMS.txt disagrees with $name" }
            "ok  $name"
          }

      - name: Attest where the installer and zip came from
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/attest@v4
        with:
          # latest.yml too: it holds the SHA-512 the in-app updater checks
          # every download against, so it is worth being able to verify.
          subject-path: |
            electron/dist/*.exe
            electron/dist/*.zip
            electron/dist/latest.yml

      - uses: actions/upload-artifact@v7
        with:
          # By commit: a pull request's ref name ("12/merge") holds a slash,
          # which an artifact name may not.
          name: prune-${{ github.sha }}
          # latest.yml and the blockmap are what the in-app updater reads
          # from a release: without latest.yml the update button finds
          # nothing, and the blockmap lets the NEXT release download only
          # the parts of the installer that changed.
          path: |
            electron/dist/*.exe
            electron/dist/*.zip
            electron/dist/SHA256SUMS.txt
            electron/dist/latest.yml
            electron/dist/*.blockmap
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 14 }}

  draft-release:
    name: Draft the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: prune-*
          path: dist
          merge-multiple: true
      # A DRAFT: nothing is public until a person has replaced these notes
      # with the changelog entry and published it. The files attached are
      # the ones this workflow built and attested -- see RELEASING.md.
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag \
            --title "Prune ${TAG#v}" \
            --notes "Built by GitHub Actions from ${GITHUB_SHA}. Replace these notes with the changelog entry before publishing."
