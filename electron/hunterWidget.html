<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Prune Hunter</title>
<style>
  /* Hunter's crosshair. This page cannot read the app's stylesheet, so it keeps
     a small palette of its own that matches Prune's (cyan accent, dark panel,
     and the light counterpart when Windows is in light mode). */
  :root {
    color-scheme: dark light;
    --panel: rgba(19, 19, 22, 0.96);
    --edge: rgba(255, 255, 255, 0.16);
    --ink: #fafafa;
    --ink-soft: #a1a1aa;
    --accent: #06b6d4;
    --accent-soft: rgba(6, 182, 212, 0.18);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --panel: rgba(255, 255, 255, 0.97);
      --edge: rgba(28, 25, 23, 0.18);
      --ink: #1c1917;
      --ink-soft: #57534e;
      --accent: #0e7490;
      --accent-soft: rgba(14, 116, 144, 0.14);
    }
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .panel {
    position: absolute;
    inset: 2px;
    box-sizing: border-box;
    border-radius: 16px;
    background: var(--panel);
    border: 1px solid var(--edge);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 8px 4px 5px;
  }
  #cancel {
    position: absolute;
    top: 3px;
    right: 3px;
    width: 18px;
    height: 18px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 13px;
    line-height: 18px;
    cursor: default;
  }
  #cancel:hover, #cancel:focus-visible { background: var(--accent-soft); color: var(--ink); outline: none; }
  #target {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    cursor: crosshair;
    touch-action: none;
  }
  #target:hover { background: var(--accent-soft); }
  svg { width: 40px; height: 40px; display: block; pointer-events: none; }
  .mark { stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; }
  .dot { fill: var(--accent); stroke: none; }
  /* While the crosshair is held, the pointer stays a crosshair wherever it goes
     and the mark dims, as if it had been picked up. */
  body.armed, body.armed * { cursor: crosshair !important; }
  body.armed .mark { opacity: 0.35; }
  #hint {
    max-width: 72px;
    font-size: 10.5px;
    line-height: 1.15;
    color: var(--ink-soft);
    text-align: center;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
</style>
</head>
<body>
<div class="panel">
  <button id="cancel" type="button">&#215;</button>
  <div id="target" role="img">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" aria-hidden="true">
      <circle class="mark" cx="20" cy="20" r="11"/>
      <path class="mark" d="M20 2v8M20 30v8M2 20h8M30 20h8"/>
      <circle class="dot" cx="20" cy="20" r="2.4"/>
    </svg>
  </div>
  <div id="hint"></div>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var hint = params.get('hint') || 'Drag onto a window';
  var cancelLabel = params.get('cancel') || 'Cancel';
  var target = document.getElementById('target');
  var cancel = document.getElementById('cancel');

  // Text only: set as text, never as markup.
  document.getElementById('hint').textContent = hint;
  target.setAttribute('aria-label', hint);
  cancel.setAttribute('aria-label', cancelLabel);

  var armed = false;
  function disarm() {
    armed = false;
    document.body.classList.remove('armed');
  }

  // Press on the crosshair, drag anywhere, let go over the window to identify.
  // Pointer capture keeps the release coming here even outside this window.
  target.addEventListener('pointerdown', function (event) {
    if (event.button !== 0) return;
    armed = true;
    document.body.classList.add('armed');
    try { target.setPointerCapture(event.pointerId); } catch (e) { /* the release still arrives while held */ }
    event.preventDefault();
  });
  target.addEventListener('pointerup', function () {
    if (!armed) return;
    disarm();
    window.pruneHunterWidget.drop();
  });
  target.addEventListener('pointercancel', disarm);
  target.addEventListener('lostpointercapture', disarm);

  cancel.addEventListener('click', function () { window.pruneHunterWidget.cancel(); });
  window.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
      event.preventDefault();
      window.pruneHunterWidget.cancel();
    }
  });
})();
</script>
</body>
</html>
