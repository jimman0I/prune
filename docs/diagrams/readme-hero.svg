<svg viewBox="0 0 1200 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Prune: uninstall it, then find what it left behind. Every leftover file, registry key and scheduled task is quarantined first, so nothing is lost by mistake. 87 cleaner rules, 31 categories, 40 languages, zero telemetry.">
  <desc>Animated hero card. Three leftovers found after an uninstall (a folder, a registry key and a scheduled task) are checked off one after another as quarantined, in place, on a slow loop. Everything that matters is readable on the first frame and with motion turned off.</desc>
  <style>
    .sans { font-family: 'Segoe UI', Inter, Arial, Helvetica, system-ui, sans-serif; }
    .mono { font-family: Consolas, 'Cascadia Mono', 'Courier New', monospace; }

    /* One 10s loop. Row N is "found" (cyan flash) just before its time, then
       settles to quarantined (green, dimmed) and holds until the shared fade
       back at 84-92%. Nothing translates: state changes in place. */
    .row   { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .r1 { animation-name: dim1; } .r2 { animation-name: dim2; } .r3 { animation-name: dim3; }
    .tag   { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .t1 { animation-name: tag1; } .t2 { animation-name: tag2; } .t3 { animation-name: tag3; }
    .ok    { opacity: 0; animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .o1 { animation-name: ok1; } .o2 { animation-name: ok2; } .o3 { animation-name: ok3; }
    .flash { opacity: 0; animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
    .f1 { animation-name: fl1; } .f2 { animation-name: fl2; } .f3 { animation-name: fl3; }
    .pulse { animation: glow 10s ease-in-out infinite; }
    .dot   { animation: travel 6s linear infinite; }

    @keyframes dim1 { 0%,17% { opacity:1; } 24%,84% { opacity:.62; } 92%,100% { opacity:1; } }
    @keyframes dim2 { 0%,31% { opacity:1; } 38%,84% { opacity:.62; } 92%,100% { opacity:1; } }
    @keyframes dim3 { 0%,45% { opacity:1; } 52%,84% { opacity:.62; } 92%,100% { opacity:1; } }

    @keyframes tag1 { 0%,19% { opacity:1; } 24%,84% { opacity:0; } 92%,100% { opacity:1; } }
    @keyframes tag2 { 0%,33% { opacity:1; } 38%,84% { opacity:0; } 92%,100% { opacity:1; } }
    @keyframes tag3 { 0%,47% { opacity:1; } 52%,84% { opacity:0; } 92%,100% { opacity:1; } }

    @keyframes ok1 { 0%,19% { opacity:0; } 24%,84% { opacity:1; } 92%,100% { opacity:0; } }
    @keyframes ok2 { 0%,33% { opacity:0; } 38%,84% { opacity:1; } 92%,100% { opacity:0; } }
    @keyframes ok3 { 0%,47% { opacity:0; } 52%,84% { opacity:1; } 92%,100% { opacity:0; } }

    @keyframes fl1 { 0%,12% { opacity:0; } 17% { opacity:1; } 24%,100% { opacity:0; } }
    @keyframes fl2 { 0%,26% { opacity:0; } 31% { opacity:1; } 38%,100% { opacity:0; } }
    @keyframes fl3 { 0%,40% { opacity:0; } 45% { opacity:1; } 52%,100% { opacity:0; } }

    @keyframes glow {
      0%,18%  { stroke-opacity:.35; } 24% { stroke-opacity:.9; } 30%,32% { stroke-opacity:.4; }
      38% { stroke-opacity:.9; } 44%,46% { stroke-opacity:.4; } 52% { stroke-opacity:1; }
      62%,100% { stroke-opacity:.35; }
    }
    @keyframes travel {
      0%   { transform: translateX(0);      opacity: 0; }
      8%   { opacity: .95; }
      70%  { opacity: .95; }
      100% { transform: translateX(1104px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .row, .tag, .ok, .flash, .pulse, .dot { animation: none !important; }
      .ok, .flash, .dot { opacity: 0; }
    }
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowBg" cx="18%" cy="14%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="540" rx="18" fill="#0b0d12"/>
  <rect width="1200" height="540" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="540" rx="18" fill="url(#glowBg)"/>

  <!-- kicker -->
  <text x="48" y="64" class="mono" font-size="13" letter-spacing="2.5" fill="#67e8f9">PRUNE — A WINDOWS UNINSTALLER</text>
  <text x="1152" y="64" text-anchor="end" class="mono" font-size="12" letter-spacing="1.5" fill="#71717a">QUARANTINE FIRST · RESTORE ANY TIME</text>

  <!-- headline -->
  <text x="48" y="136" class="sans" font-size="54" font-weight="800" fill="#e9edf3">Uninstall it<tspan fill="#22d3ee">.</tspan></text>
  <text x="48" y="196" class="sans" font-size="54" font-weight="800" fill="#e9edf3">Then find what it left behind<tspan fill="#22d3ee">.</tspan></text>

  <!-- sub -->
  <text x="48" y="238" class="sans" font-size="20" fill="#a1a1aa">Every leftover file, registry key and scheduled task — <tspan fill="#e9edf3" font-weight="600">quarantined first</tspan>, so a bad match is never a disaster.</text>

  <!-- divider + travelling pulse -->
  <line x1="48" y1="272" x2="1152" y2="272" stroke="#232b38" stroke-width="1.5"/>
  <circle class="dot" cx="48" cy="272" r="4" fill="url(#brand)" opacity="0"/>

  <!-- leftovers -->
  <text x="48" y="308" class="mono" font-size="11.5" letter-spacing="2" fill="#71717a">LEFT BEHIND AFTER THE UNINSTALL</text>

  <!-- row 1: folder -->
  <g>
    <g class="row r1">
      <rect x="48" y="322" width="540" height="46" rx="10" fill="#12151c" stroke="#232b38"/>
      <g transform="translate(68,336)" fill="none" stroke="#67e8f9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 5a2 2 0 0 1 2-2h4l2 2.5h6a2 2 0 0 1 2 2V16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/>
      </g>
      <text x="100" y="351" class="mono" font-size="14" fill="#e9edf3">C:\Users\you\AppData\Roaming\OldApp</text>
      <text class="tag t1 mono" x="574" y="351" text-anchor="end" font-size="11" fill="#71717a">folder</text>
    </g>
    <rect class="flash f1" x="48" y="322" width="540" height="46" rx="10" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-width="1.5"/>
    <rect class="ok o1" x="48" y="322" width="540" height="46" rx="10" fill="none" stroke="#4ade80" stroke-opacity=".6" stroke-width="1.5"/>
    <text class="ok o1 mono" x="574" y="351" text-anchor="end" font-size="11" fill="#86efac">✓ quarantined</text>
  </g>

  <!-- row 2: registry key -->
  <g>
    <g class="row r2">
      <rect x="48" y="378" width="540" height="46" rx="10" fill="#12151c" stroke="#232b38"/>
      <g transform="translate(68,392)" fill="none" stroke="#a5b4fc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="16" height="14" rx="2"/><path d="M6 8h8M6 12h5"/>
      </g>
      <text x="100" y="407" class="mono" font-size="14" fill="#e9edf3">HKCU\Software\OldApp\Run</text>
      <text class="tag t2 mono" x="574" y="407" text-anchor="end" font-size="11" fill="#71717a">registry key</text>
    </g>
    <rect class="flash f2" x="48" y="378" width="540" height="46" rx="10" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-width="1.5"/>
    <rect class="ok o2" x="48" y="378" width="540" height="46" rx="10" fill="none" stroke="#4ade80" stroke-opacity=".6" stroke-width="1.5"/>
    <text class="ok o2 mono" x="574" y="407" text-anchor="end" font-size="11" fill="#86efac">✓ quarantined</text>
  </g>

  <!-- row 3: scheduled task -->
  <g>
    <g class="row r3">
      <rect x="48" y="434" width="540" height="46" rx="10" fill="#12151c" stroke="#232b38"/>
      <g transform="translate(68,448)" fill="none" stroke="#fcd34d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="10" r="8"/><path d="M10 5.5V10l3 2"/>
      </g>
      <text x="100" y="463" class="mono" font-size="14" fill="#e9edf3">Task Scheduler\OldApp Updater</text>
      <text class="tag t3 mono" x="574" y="463" text-anchor="end" font-size="11" fill="#71717a">scheduled task</text>
    </g>
    <rect class="flash f3" x="48" y="434" width="540" height="46" rx="10" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-width="1.5"/>
    <rect class="ok o3" x="48" y="434" width="540" height="46" rx="10" fill="none" stroke="#4ade80" stroke-opacity=".6" stroke-width="1.5"/>
    <text class="ok o3 mono" x="574" y="463" text-anchor="end" font-size="11" fill="#86efac">✓ quarantined</text>
  </g>

  <!-- quarantine box -->
  <rect x="716" y="316" width="436" height="170" rx="14" fill="#0e1218" stroke="#22d3ee" stroke-width="2" class="pulse" stroke-opacity="0.35"/>
  <g transform="translate(744,342)" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 1l12 6v9c0 7-5 12-12 14C7 28 2 23 2 16V7z"/><path d="M8.5 15l4 4 7-8"/>
  </g>
  <text x="790" y="364" class="sans" font-size="22" font-weight="700" fill="#e9edf3">Quarantine</text>
  <text x="744" y="412" class="sans" font-size="16" fill="#a1a1aa">Files are moved and registry keys exported —</text>
  <text x="744" y="436" class="sans" font-size="16" fill="#a1a1aa">not deleted. <tspan fill="#86efac" font-weight="600">Restore any item, any time.</tspan></text>
  <text x="744" y="468" class="mono" font-size="12" fill="#71717a">nothing is gone for good until you say so, twice</text>

  <!-- stats -->
  <g class="mono" font-size="13" letter-spacing="1" fill="#71717a">
    <text x="48" y="516"><tspan fill="#22d3ee" font-weight="700">87</tspan> CLEANER RULES   ·   <tspan fill="#22d3ee" font-weight="700">31</tspan> CATEGORIES   ·   <tspan fill="#22d3ee" font-weight="700">40</tspan> LANGUAGES   ·   <tspan fill="#22d3ee" font-weight="700">0</tspan> TELEMETRY</text>
  </g>
</svg>
