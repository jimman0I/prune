[workspace]
resolver = "3"
members = ["crates/prune-core", "crates/prune-app", "crates/prune-cli"]

[workspace.package]
version = "4.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
# tiny-skia is the only renderer: no wgpu compiled in. The software
# renderer opens in about a third of the time and a fifth of the memory,
# and Prune's flat UI does not need a GPU. `thread-pool` is the executor
# tasks run on; `crisp` keeps 1 px lines on the pixel grid.
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "thread-pool", "crisp"] }
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
windows = "=0.62.2"
tray-icon = "=0.26.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
png = "0.18"
prune-core = { path = "crates/prune-core" }
