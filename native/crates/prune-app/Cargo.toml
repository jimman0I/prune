[package]
name = "prune-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "Prune"
path = "src/main.rs"

[dependencies]
prune-core.workspace = true
# `advanced` for the root event listener (keyboard, wheel and window events
# reach the app without a subscription), `svg` for the rail's line icons.
iced = { workspace = true, features = ["advanced", "svg", "image-without-codecs"] }
serde_json.workspace = true
png.workspace = true
# The renderer behind iced's tiny-skia feature, for `render`: it draws a
# view into a pixel buffer with no window.
iced_tiny_skia = { version = "=0.14.1", default-features = false }

[target.'cfg(windows)'.dependencies]
# Tray icon; its Win32 window is pumped by winit's event loop on the UI thread.
tray-icon.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    # The title bar's window subclass, auto-hide taskbar check and
    # non-client mouse-leave tracking.
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
fontdb = "0.23"
ttf-parser = "0.25"
