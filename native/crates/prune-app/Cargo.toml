[package]
name = "prune-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "Prune"
path = "src/main.rs"

[dependencies]
prune-core.workspace = true
# `advanced` for the root event listener (keyboard, wheel and window events
# reach the app without a subscription), `svg` for the rail's line icons.
iced = { workspace = true, features = ["advanced", "svg"] }
serde_json.workspace = true
png.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
